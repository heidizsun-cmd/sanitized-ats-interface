<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signal ATS Demo Login</title>
    <link rel="stylesheet" href="styles.css?v=23">
  </head>
  <body data-page="admin-login">
    <main class="login-shell">
      <section class="login-panel panel" aria-label="Admin login">
        <a class="brand login-brand" href="careers.html" aria-label="Signal ATS demo home">
          <img class="brand-mark" src="assets/signal-mark.svg" alt="">
          <span>
            <strong>Signal ATS</strong>
            <small>Sanitized local demo</small>
          </span>
        </a>
        <div>
          <p class="eyebrow">Private Dashboard</p>
          <h1>Admin login</h1>
          <p class="login-copy">Sign in to open the recruiting dashboard.</p>
        </div>
        <form id="admin-login-form" class="stacked-form">
          <label>Username<input name="username" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="primary-action wide" type="submit">Open dashboard</button>
          <p id="admin-login-status" class="form-status" role="status"></p>
        </form>
      </section>
    </main>

    <script src="app.js?v=24"></script>
  </body>
</html>
